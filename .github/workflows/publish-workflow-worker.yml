name: Publish Alga Worker Images

on:
  push:
    branches:
      - local-release
    paths:
      - .github/workflows/publish-workflow-worker.yml
      - services/workflow-worker/**
      - ee/packages/workflows/**
      - ee/temporal-workflows/**
      - ee/server/**
      - server/**
      - shared/**
      - packages/**
      - .dockerignore
      - .npmrc
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.base.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: alga-worker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: workflow-worker
            dockerfile: services/workflow-worker/Dockerfile
          - image: temporal-worker
            dockerfile: ee/temporal-workflows/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marcmontecalvo/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Make package publicly pullable
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('PATCH /user/packages/{package_type}/{package_name}', {
              package_type: 'container',
              package_name: '${{ matrix.image }}',
              visibility: 'public',
            });
