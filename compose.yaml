name: alga-psa

# Local, non-production EE evaluation. Upstream Compose files stay unchanged.
# Build the current EE source into a production image (no Next dev server).
services:
  postgres:
    extends:
      file: docker-compose.prebuilt.ee.yaml
      service: postgres
    volumes:
      - alga-psa-postgres-data:/var/lib/postgresql/data
    ports: !reset []

  redis:
    extends:
      file: docker-compose.prebuilt.ee.yaml
      service: redis
    ports: !reset []

  pgbouncer:
    extends:
      file: docker-compose.prebuilt.ee.yaml
      service: pgbouncer
    ports: !reset []

  setup:
    extends:
      file: docker-compose.prebuilt.ee.yaml
      service: setup
    image: ${ALGA_EE_IMAGE:-alga-psa-ee-local:release-1.6.0}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      SETUP_RUN_SEEDS: "false"

  temporal-dev:
    extends:
      file: docker-compose.ee.yaml
      service: temporal-dev
    ports: !reset []

  server:
    extends:
      file: docker-compose.prebuilt.ee.yaml
      service: server
    image: ${ALGA_EE_IMAGE:-alga-psa-ee-local:release-1.6.0}
    volumes:
      - type: bind
        source: ./local-bootstrap.sh
        target: /usr/local/bin/local-bootstrap.sh
        read_only: true
      - type: bind
        source: ./local-email-check.cjs
        target: /app/server/local-email-check.cjs
        read_only: true
      - type: bind
        source: ./packages/db/package.json
        target: /app/packages/db/package.json
        read_only: true
    build:
      context: .
      dockerfile: ee/server/Dockerfile.build
      args:
        NEXT_BUILD_MAX_OLD_SPACE_SIZE: "12288"
        NEXT_PUBLIC_ALGA_USAGE_STATS: "false"
    container_name: !reset null
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TEMPORAL_ADDRESS: temporal-dev:7233
      EMAIL_ENABLE: "true"
      EMAIL_PROVIDER_TYPE: smtp
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USERNAME: noreply@local.test
      EMAIL_PASSWORD: local-test
      EMAIL_FROM: noreply@local.test
      EMAIL_REJECT_UNAUTHORIZED: "false"
      EMAIL_REQUIRE_TLS: "false"
      VERIFY_EMAIL_ENABLED: "true"
      ALGA_USAGE_STATS: "false"
      NEXT_PUBLIC_ALGA_USAGE_STATS: "false"
      POSTHOG_API_KEY: ""
      NEXT_PUBLIC_POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      NEXT_PUBLIC_POSTHOG_UI_HOST: ""
    depends_on: !override
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      temporal-dev:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - app-network

  # Source-built background workers are opt-in for workflow/IMAP testing.
  workflow-worker:
    extends:
      file: docker-compose.prebuilt.ee.yaml
      service: workflow-worker
    profiles: [workers]

  email-service:
    extends:
      file: docker-compose.prebuilt.ee.yaml
      service: email-service
    profiles: [workers]

  temporal-worker:
    extends:
      file: docker-compose.ee.yaml
      service: temporal-worker
    profiles: [workers]

networks:
  app-network:
    driver: bridge

volumes:
  files_data:
  alga-psa-postgres-data:
    external: true
    name: ${ALGA_PG_VOLUME:-alga-psa-postgres-data}

secrets:
  db_password_server:
    file: ./secrets/db_password_server
  db_password_hocuspocus:
    file: ./secrets/db_password_hocuspocus
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  email_password:
    file: ./secrets/email_password
  crypto_key:
    file: ./secrets/crypto_key
  token_secret_key:
    file: ./secrets/token_secret_key
  nextauth_secret:
    file: ./secrets/nextauth_secret
  credential_encryption_key:
    file: ./secrets/credential_encryption_key
  google_oauth_client_id:
    file: ./secrets/google_oauth_client_id
  google_oauth_client_secret:
    file: ./secrets/google_oauth_client_secret
  alga_auth_key:
    file: ./secrets/alga_auth_key
  ninjaone_client_id:
    file: ./secrets/ninjaone_client_id
  ninjaone_client_secret:
    file: ./secrets/ninjaone_client_secret
